services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpulse-dev-only}
      POSTGRES_DB: marketpulse
    volumes:
      - marketpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://marketpulse:${POSTGRES_PASSWORD:-marketpulse-dev-only}@db:5432/marketpulse
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-AAPL,MSFT,NVDA,AMZN,TSLA,META,AMD,PLTR,SMCI,COIN}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-MarketPulse <reports@example.com>}
      REPORT_RECIPIENT: ${REPORT_RECIPIENT:-}
      REPORT_TIME: ${REPORT_TIME:-08:00}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  marketpulse-db: